services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-portfolio-app:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_VERSION: local-dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
